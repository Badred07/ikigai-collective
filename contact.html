<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Ikigai Collective</title>
  <meta name="description" content="Contact Ikigai Collective for wholesale, partnerships, or customer support.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="container navbar">
    <a class="brand" href="index.html">Ikigai Collective</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#products">Shop</a>
      <a href="auth.html">Account</a>
    </nav>
  </div>
</header>
<main>
  <section class="container" style="padding:3rem 0">
    <div class="section-header">
      <p class="section-title">Contact</p>
      <h2>Get in touch</h2>
      <p style="color:var(--muted)">Questions about orders, partnerships, or wholesale? Fill the form below.</p>
    </div>

    <div style="max-width:720px;margin:0 auto;background:var(--surface);padding:1.5rem;border-radius:12px;border:1px solid var(--border);">
      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label style="display:block;margin-bottom:0.5rem">Your name<input name="name" required placeholder="Full name" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border);margin-top:0.25rem"></label>
        <label style="display:block;margin-bottom:0.5rem">Email<input name="email" type="email" required placeholder="you@example.com" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border);margin-top:0.25rem"></label>
        <label style="display:block;margin-bottom:0.5rem">Message<textarea name="message" required placeholder="How can we help?" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border);margin-top:0.25rem;min-height:120px"></textarea></label>
        <div style="display:flex;gap:0.6rem"><button class="btn cta-button" type="submit">Send Message</button><a href="mailto:hello@ikigai_collective.com" class="btn secondary-button">Email Us</a></div>
      </form>
    </div>
  </section>
</main>
<footer>
  <div class="container">
    <div class="footer-bottom">
      <p>© 2026 www.ikigai_collective.com • Premium Anime Fashion</p>
      <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
    </div>
  </div>
</footer>
</body>
</html>
